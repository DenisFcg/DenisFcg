<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label=""><title></title><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sw{animation:sw 5s cubic-bezier(.6,0,.4,1) infinite}@keyframes sw{to{transform:translateX(1440px)}}</style>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#30363d" stop-opacity="0"/><stop offset=".5" stop-color="#30363d"/><stop offset="1" stop-color="#30363d" stop-opacity="0"/></linearGradient>
<linearGradient id="h" x1="0" x2="1"><stop offset="0" stop-color="#8b80f9" stop-opacity="0"/><stop offset=".5" stop-color="#8b80f9"/><stop offset="1" stop-color="#8b80f9" stop-opacity="0"/></linearGradient></defs>
<rect y="11" width="1200" height="1" fill="url(#l)"/>
<rect class="sw" x="-240" y="10.5" width="240" height="2" fill="url(#h)"/>
</svg>