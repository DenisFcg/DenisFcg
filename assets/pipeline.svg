k</text><text class="s" x="796.0" y="179.0" font-size="13" fill="#8b949e" text-anchor="middle">is the API up?</text></g><g class="fd" style="animation-delay:0.25s"><path d="M212 160.0H260" fill="none" stroke="#30363d" stroke-width="2"/><path class="flow" d="M212 160.0H260" fill="none" stroke="#8b80f9" stroke-width="2" stroke-linecap="round"/></g><g class="fd" style="animation-delay:0.40s"><path d="M436 160.0H484" fill="none" stroke="#30363d" stroke-width="2"/><path class="flow" d="M436 160.0H484" fill="none" stroke="#8b80f9" stroke-width="2" stroke-linecap="round"/></g><g class="fd" style="animation-delay:0.55s"><path d="M660 160.0H708" fill="none" stroke="#30363d" stroke-width="2"/><path class="flow" d="M660 160.0H708" fill="none" stroke="#8b80f9" stroke-width="2" stroke-linecap="round"/></g><g class="fd" style="animation-delay:0.75s"><path d="M884 160.0C940 160.0 930 82 972 82" fill="none" stroke="#30363d" stroke-width="2"/><path class="flow" d="M884 160.0C940 160.0 930 82 972 82" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/></g><g class="fd" style="animation-delay:0.80s"><path d="M884 160.0C940 160.0 930 238 972 238" fill="none" stroke="#30363d" stroke-width="2"/><path class="flow" d="M884 160.0C940 160.0 930 238 972 238" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round"/></g><g class="up" style="animation-delay:0.90s"><rect x="972" y="46" width="192" height="72" rx="12" fill="#161b22" stroke="#3fb950" stroke-opacity=".55"/><rect x="972" y="60" width="3" height="44" rx="1.5" fill="#3fb950"/><text class="s" x="1068.0" y="79.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">New version live</text><text class="s" x="1068.0" y="101.0" font-size="13" fill="#8b949e" text-anchor="middle">Nginx + HTTPS</text></g><g class="up" style="animation-delay:1.00s"><rect x="972" y="202" width="192" height="72" rx="12" fill="#161b22" stroke="#d29922" stroke-opacity=".55"/><rect x="972" y="216" width="3" height="44" rx="1.5" fill="#d29922"/><text class="s" x="1068.0" y="235.0" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="middle">Rollback</text><text class="s" x="1068.0" y="257.0" font-size="13" fill="#8b949e" text-anchor="middle">previous version restored</text></g><g class="fd" style="animation-delay:1.1s"><text class="s" x="914" y="100" font-size="12" fill="#3fb950" text-anchor="end">pass</text><text class="s" x="914" y="232" font-size="12" fill="#d29922" text-anchor="end">fail</text></g><circle r="4.5" fill="#3fb950" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.2s"/><animateMotion dur="4.5s" begin="1.2s" repeatCount="indefinite" path="M124.0 160.0H884C940 160.0 930 82 972 82" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle><circle r="4.5" fill="#d29922" visibility="hidden"><set attributeName="visibility" to="visible" begin="3.45s"/><animateMotion dur="4.5s" begin="3.45s" repeatCount="indefinite" path="M124.0 160.0H884C940 160.0 930 238 972 238" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/></circle></svg>