<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Deploy pipeline: git push, GitHub Actions, deploy to VPS, health check; on pass the new version goes live, on fail it rolls back automatically."><title>Deploy pipeline: git push, GitHub Actions, deploy to VPS, health check; on pass the new version goes live, on fail it rolls back automatically.</title><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
