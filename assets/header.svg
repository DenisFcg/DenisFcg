<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Denis Godoi, Desenvolvedor Full Stack. Python, FastAPI, Next.js, PostgreSQL e Linux. Uberlândia, MG."><title>Denis Godoi, Desenvolvedor Full Stack. Python, FastAPI, Next.js, PostgreSQL e Linux. Uberlândia, MG.</title><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.g1{animation:d1 16s ease-in-out infinite alternate}
.g2{animation:d2 18s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(140px,40px)}}
@keyframes d2{to{transform:translate(-160px,-50px)}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1.05s steps(1) infinite}
</style>
