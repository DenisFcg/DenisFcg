<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="GoNFC: Website, API, seller dashboard and sales team app for an NFC sign brand. "><title>GoNFC: Website, API, seller dashboard and sales team app for an NFC sign brand. </title><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sh{animation:sh 6s cubic-bezier(.6,0,.4,1) infinite}@keyframes sh{0%{transform:translateX(0)}60%,100%{transform:translateX(800px)}}</style>
<defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#3fb950" stop-opacity="0"/><stop offset=".5" stop-color="#3fb950"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="600" height="260" rx="14"/></clipPath>
<radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3fb950" stop-opacity=".14"/><stop offset=".6" stop-color="#3fb950" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#c)"><rect width="600" height="260" fill="#161b22"/><rect width="600" height="260" fill="url(#g)"/>
<rect class="sh" x="-200" y="0" width="200" height="2" fill="url(#t)"/></g>
<rect x=".5" y=".5" width="599" height="259" rx="14" fill="none" stroke="#30363d"/>
<g class="up" style="animation-delay:.1s"><text class="m" x="32" y="51" font-size="12.5" fill="#3fb950" letter-spacing="1">NFC · SALES</text></g>
<g class="up" style="animation-delay:.2s"><text class="s" x="31" y="88" font-size="28" font-weight="700" fill="#e6edf3">GoNFC</text></g>
<g class="up" style="animation-delay:.3s"><text class="s" x="32" y="120" font-size="16" fill="#8b949e">Website, API, seller dashboard and sales team</text><text class="s" x="32" y="144" font-size="16" fill="#8b949e">app for an NFC sign brand.</text><text class="s" x="32" y="168" font-size="16" fill="#8b949e"></text></g>
<g class="up" style="animation-delay:.42s"><rect x="32" y="204" width="104" height="28" rx="14" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".35"/><text class="s" x="84.0" y="222.5" font-size="13" fill="#e6edf3" text-anchor="middle">TypeScript</text><rect x="144" y="204" width="73" height="28" rx="14" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".35"/><text class="s" x="180.5" y="222.5" font-size="13" fill="#e6edf3" text-anchor="middle">Python</text><rect x="225" y="204" width="81" height="28" rx="14" fill="#3fb950" fill-opacity=".10" stroke="#3fb950" stroke-opacity=".35"/><text class="s" x="265.5" y="222.5" font-size="13" fill="#e6edf3" text-anchor="middle">Next.js</text></g>
