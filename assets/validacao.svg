<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Validação de documentos em três camadas: pré-validação no navegador, análise por IA com score de confiança e fila de revisão humana para score baixo, com trilha de auditoria."><title>Validação de documentos em três camadas: pré-validação no navegador, análise por IA com score de confiança e fila de revisão humana para score baixo, com trilha de auditoria.</title><style>
